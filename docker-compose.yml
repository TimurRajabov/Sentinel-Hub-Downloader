version: "3.9"

services:
  api:
    image: thehokim/sentinel5p:latest
    container_name: sentinel5p-api
    restart: always
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8121:8000"
    command: sh -lc "uvicorn api_all:app --host 0.0.0.0 --port 8000"
    volumes:
      - /opt/sentinel5p/data:/data
      - /opt/sentinel5p/geojson:/geojson:ro
      - /opt/sentinel5p/logs:/app/logs
      - /opt/sentinel5p/earthengine_credentials.json:/root/.config/earthengine/credentials:ro
    networks:
      - sentinel-net

  sentinel-gases:
    image: thehokim/sentinel5p:latest
    container_name: sentinel5p-gases
    restart: always
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    command: sh -lc "mkdir -p /root/.config/earthengine && python -u download_all.py"
    volumes:
      - /opt/sentinel5p/data:/data
      - /opt/sentinel5p/logs:/app/logs
      - /opt/sentinel5p/geojson:/geojson:ro
      - /opt/sentinel5p/earthengine_credentials.json:/root/.config/earthengine/credentials:ro
    networks:
      - sentinel-net

  sentinel-temperature:
    image: thehokim/sentinel5p:latest
    container_name: sentinel5p-temperature
    restart: always
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    command: sh -lc "mkdir -p /root/.config/earthengine && python -u temp.py"
    volumes:
      - /opt/sentinel5p/data:/data
      - /opt/sentinel5p/logs:/app/logs
      - /opt/sentinel5p/geojson:/geojson:ro
      - /opt/sentinel5p/earthengine_credentials.json:/root/.config/earthengine/credentials:ro
    networks:
      - sentinel-net

  sentinel-wind:
    image: thehokim/sentinel5p:latest
    container_name: sentinel5p-wind
    restart: always
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    command: sh -lc "mkdir -p /root/.config/earthengine && python -u wind.py"
    volumes:
      - /opt/sentinel5p/data:/data
      - /opt/sentinel5p/logs:/app/logs
      - /opt/sentinel5p/geojson:/geojson:ro
      - /opt/sentinel5p/earthengine_credentials.json:/root/.config/earthengine/credentials:ro
    networks:
      - sentinel-net

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: always
    ports:
      - "9104:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - sentinel-net

  scanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: sonar-scanner
    depends_on:
      - sonarqube
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN}
    volumes:
      - /opt/sentinel5p:/usr/src
    networks:
      - sentinel-net
    entrypoint: ["sleep", "infinity"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: always
    ports:
      - "8110:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - sentinel-net

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  sentinel-net:
    driver: bridge