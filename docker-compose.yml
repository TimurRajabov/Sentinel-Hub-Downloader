version: "3.9"

services:
  api:
    build: .
    container_name: sentinel5p-api
    restart: always
    env_file: .env
    ports:
      - "8120:8000"
    volumes:
      # DATA (общая для всех сервисов)
      - /home/temur/Documents/Work/goo/data:/data

      # GEOJSON
      - /home/temur/Documents/Work/goo/geojson/uzbekistan_regions_backup.geojson:/geojson/uzbekistan_regions_backup.geojson

      # LOGS
      - ./logs:/app/logs
    networks:
      - sentinel-net

  # ===============================
  #   AUTO DOWNLOAD — GASES
  # ===============================
  sentinel-gases:
    build: .
    container_name: sentinel5p-gases
    restart: always
    env_file: .env
    command: python download_all.py
    volumes:
      - /home/temur/Documents/Work/goo/data:/data
      - ./logs:/app/logs
    networks:
      - sentinel-net

  # ===============================
  #   AUTO DOWNLOAD — TEMPERATURE
  # ===============================
  sentinel-temperature:
    build: .
    container_name: sentinel5p-temperature
    restart: always
    env_file: .env
    command: python temp.py
    volumes:
      - /home/temur/Documents/Work/goo/data:/data
      - ./logs:/app/logs
    networks:
      - sentinel-net

  # ===============================
  #   AUTO DOWNLOAD — WIND
  # ===============================
  sentinel-wind:
    build: .
    container_name: sentinel5p-wind
    restart: always
    env_file: .env
    command: python wind.py
    volumes:
      - /home/temur/Documents/Work/goo/data:/data
      - ./logs:/app/logs
    networks:
      - sentinel-net

  # ===============================
  #   SONARQUBE
  # ===============================
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: always
    ports:
      - "9101:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - sentinel-net

  scanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: sonar-scanner
    depends_on:
      - sonarqube
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN}
    volumes:
      - ./:/usr/src
    networks:
      - sentinel-net
    entrypoint: ["sleep", "infinity"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: always
    ports:
      - "8110:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - sentinel-net

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  sentinel-net:
    driver: bridge
