name: CI/CD

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Clean workspace
        run: rm -rf "${{ github.workspace }}"/*

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install lint tools
        run: pip install flake8 isort black mypy bandit

      - name: Auto-fix imports (isort)
        run: isort .

      - name: Auto-format code (black)
        run: black .

      - name: Commit & push formatting changes (if any)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: auto-format (isort/black) [skip ci]"
            git push origin main
          else
            echo "No formatting changes"
          fi

      - name: Run flake8
        run: flake8 .

      - name: Run mypy (optional)
        run: |
          if [ -f mypy.ini ]; then
            mypy . --config-file mypy.ini
          else
            echo "mypy.ini not found, skipping mypy"
          fi

      - name: Run bandit (medium/high only)
        run: |
          bandit -r . \
            --exclude ./venv,./.venv,./__pycache__,./tests,./logs,./data,./output,./word \
            --skip B101,B601 \
            --format screen \
            -ll

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  test:
    if: !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: self-hosted
    needs: lint
    timeout-minutes: 45

    steps:
      - name: Clean workspace
        run: rm -rf "${{ github.workspace }}"/*

      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> $GITHUB_ENV

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies (NO GDAL from pip)
        run: |
          # ВАЖНО: GDAL лучше не тянуть через pip на self-hosted без системных либ
          # Убедись, что в requirements.txt НЕТ строки GDAL
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Prepare CI env vars (so imports don't crash)
        run: |
          mkdir -p "${{ github.workspace }}/data"
          echo "SAVE_PATH=${{ github.workspace }}/data" >> $GITHUB_ENV
          echo "RASTERS_ROOT=${{ github.workspace }}/data" >> $GITHUB_ENV
          echo "MINTAQA_SHP=${{ github.workspace }}/polygons/Mintaqa.shp" >> $GITHUB_ENV
          echo "TUMAN_SHP=${{ github.workspace }}/polygons/Tuman.shp" >> $GITHUB_ENV
          echo "TEXT_JSON_PATH=${{ github.workspace }}/text.json" >> $GITHUB_ENV

      - name: Decide which tests to run (gdal/ee)
        id: flags
        shell: bash
        run: |
          python - << 'PY'
          import os
          # gdal present?
          try:
              import osgeo  # noqa
              gdal = True
          except Exception:
              gdal = False

          # earth engine present/configured?
          ee_ok = bool(os.getenv("EE_PROJECT")) or bool(os.getenv("GOOGLE_APPLICATION_CREDENTIALS")) or bool(os.getenv("EARTHENGINE_CREDENTIALS"))
          print("GDAL_OK=" + ("true" if gdal else "false"))
          print("EE_OK=" + ("true" if ee_ok else "false"))
          PY

          GDAL_OK="$(python - << 'PY'
          try:
              import osgeo  # noqa
              print("true")
          except Exception:
              print("false")
          PY
          )"

          EE_OK="false"
          if [ -n "${EE_PROJECT}" ] || [ -n "${GOOGLE_APPLICATION_CREDENTIALS}" ] || [ -n "${EARTHENGINE_CREDENTIALS}" ]; then
            EE_OK="true"
          fi

          echo "gdal_ok=$GDAL_OK" >> $GITHUB_OUTPUT
          echo "ee_ok=$EE_OK" >> $GITHUB_OUTPUT

      - name: Run tests
        env:
          ENV: ci
          LEFT_LON: "0"
          RIGHT_LON: "0"
          TOP_LAT: "0"
          BOTTOM_LAT: "0"
          START_DATE: "2025-01-01"
          END_DATE: "2025-01-02"
          SAVE_PATH: "${{ env.SAVE_PATH }}"
        run: |
          MARK_EXPR=""

          if [ "${{ steps.flags.outputs.gdal_ok }}" != "true" ]; then
            echo "⚠️ GDAL NOT available -> skip gdal tests"
            MARK_EXPR="not gdal"
          else
            echo "✅ GDAL available"
          fi

          if [ "${{ steps.flags.outputs.ee_ok }}" != "true" ]; then
            echo "⚠️ EarthEngine NOT configured -> skip ee tests"
            if [ -n "$MARK_EXPR" ]; then
              MARK_EXPR="$MARK_EXPR and not ee"
            else
              MARK_EXPR="not ee"
            fi
          else
            echo "✅ EarthEngine configured"
          fi

          if [ -n "$MARK_EXPR" ]; then
            pytest tests/ -v -m "$MARK_EXPR" --cov=. --cov-report=xml --cov-report=term
          else
            pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  sonarqube:
    if: !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: self-hosted
    needs: test
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
        run: |
          export SONAR_SCANNER_OPTS="-Xmx2g"
          sonar-scanner \
            -Dsonar.host.url=${SONAR_HOST} \
            -Dsonar.login=${SONAR_TOKEN}

  build_and_push:
    if: !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: self-hosted
    needs: sonarqube
    timeout-minutes: 60

    steps:
      - name: Clean workspace
        run: rm -rf "${{ github.workspace }}"/*

      - uses: actions/checkout@v3

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build and Push Image
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/sentinel5p-api:${{ github.sha }} \
                       -t ${{ secrets.DOCKER_USER }}/sentinel5p-api:latest .
          docker push ${{ secrets.DOCKER_USER }}/sentinel5p-api:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USER }}/sentinel5p-api:latest

  deploy:
    if: !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: self-hosted
    needs: build_and_push
    timeout-minutes: 30

    steps:
      - name: Clean workspace
        run: rm -rf "${{ github.workspace }}"/*

      - uses: actions/checkout@v3

      - name: Prepare deployment
        run: |
          mkdir -p /opt/sentinel5p
          cp -f docker-compose.yml /opt/sentinel5p/
          cat > /opt/sentinel5p/.env << 'EOF'
          # ENV for sentinel5p project
          EOF

      - name: Deploy with Docker Compose
        run: |
          cd /opt/sentinel5p
          docker compose down || true
          docker compose up -d --build
          docker compose ps
          docker image prune -af --filter "until=24h"

      - name: Health Check
        run: |
          sleep 20
          if curl -f http://localhost:8121/docs > /dev/null 2>&1; then
            echo "Backend is healthy!"
          else
            docker logs sentinel5p-api --tail 80 || true
            exit 1
          fi
